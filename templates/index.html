<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <main class="container">
      <section class="card joke-card" aria-labelledby="title">
        <p class="eyebrow">Powered by JokeAPI</p>
        <h1 id="title">Random Joke Generator</h1>
        <p class="subtitle">Need a quick laugh? Choose a category and get a safe joke from an external API.</p>

        <label for="category">Category</label>
        <select id="category">
          <option value="Any">Any</option>
          <option value="Programming">Programming</option>
          <option value="Misc">Miscellaneous</option>
          <option value="Pun">Puns</option>
          <option value="Spooky">Spooky</option>
          <option value="Christmas">Christmas</option>
        </select>

        <button id="jokeButton" type="button">Tell me a joke</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <blockquote id="joke" class="joke" aria-live="polite">Your joke will appear here.</blockquote>
        <p class="source">Jokes provided by <a href="https://jokeapi.dev/" target="_blank" rel="noreferrer">JokeAPI</a>.</p>
      </section>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
